mcp_only:
- tool: list_workspaces
  reason: >-
    No workspace resource exists in the Premium Bank API OpenAPI. The connector needs it because a single
    OAuth grant can cover several Memo Bank workspaces and the agent must choose one; a JWT-authenticated
    REST client is already scoped to one workspace by its certificate, so the concept has no REST analogue.
- tool: list_users
  reason: >-
    Coming soon per Memo Bank's docs. The OpenAPI declares a Users tag but publishes zero operations under
    it, so there is no REST operation to bind to yet.
- tool: prepare_transfers
  reason: >-
    Coming soon, and by design not a binding to createTransferV2 - Memo Bank states the connector cannot
    initiate payments. It would be a human-in-the-loop preparation step with no public REST equivalent.

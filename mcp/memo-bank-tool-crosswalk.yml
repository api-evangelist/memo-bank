note: >-
  Binds each Memo Bank MCP connector tool to the Premium Bank API operation that backs it. The connector's
  live tools/list is OAuth-gated (HTTP 401), so bindings are made by name and documented semantics against
  operationIds verified verbatim in the OpenAPI, and confidence is set accordingly - high where the tool
  name and the operation are an exact one-to-one match on the same resource, medium where the tool's
  documented filter set is richer or narrower than the operation's parameters. No tool or operation here is
  invented; every operationId was grepped out of
  openapi/memo-bank-premium-bank-api-openapi.yml. The documentation-portal MCP server
  (docs.api.memo.bank/mcp) is excluded from the crosswalk: its five tools read documentation pages, not the
  banking API, so they have no REST counterpart by design and would distort the coverage counts.

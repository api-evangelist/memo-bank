access_control:
  ip_allow_list: >-
    Applications support an IP allow-list, managed per application in the web interface alongside
    certificates and webhooks.
  granular_permissions: >-
    Owners and administrators create applications and manage their permissions, and may invite
    collaborators scoped to one application.
  marketplace_scoping: >-
    Marketplace applications can only reach resources inside the granted scopes AND the specific accounts
    the user authorized; out-of-scope access returns an error.

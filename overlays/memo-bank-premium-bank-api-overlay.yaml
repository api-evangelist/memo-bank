  update:
    contact:
      name: Memo Bank API support
      url: https://aide.memo.bank/category/349-api
    x-source-doc: https://aide.memo.bank/category/349-api
    x-source-note: >-
      The published spec has no info.contact block. Populated from Memo Bank's own API help centre category.
- target: $.components
  update:
    securitySchemes:
      JWT:
        type: http
        scheme: bearer
        bearerFormat: JWT
        description: >-
          Per-request RS256-signed JWT (RFC 7519 / RFC 7515) sent as Authorization: Bearer <token>. The JWT
          header carries alg (RS256), typ (JWT) and x5t#S256 (the SHA-256 thumbprint of the certificate). The
          payload carries sub (the request method, a space, then the full path including query parameters),
          aud (the target domain, e.g. api.memo.bank), iat (creation timestamp, tolerating only 5 seconds of
          clock skew), jti (a unique UUID per request), sec (the secret code from setup) and, when the request
          has a body, dig#S256 (base64url(sha256(body))). Signed with the RSA private key generated during
          setup. Because sub and dig#S256 bind the token to one exact request, tokens are not reusable.
        x-source-doc: https://docs.api.memo.bank/authentication
        x-api-evangelist-rationale: >-
          THE most important action in this overlay. All 43 operations declare security: [{JWT: []}] but the
          published document has no components.securitySchemes at all, so the requirement dangles - any
          generated client, validator or scanner sees an undefined scheme and concludes the API is
          unauthenticated. This definition is transcribed from Memo Bank's own authentication page.
- target: $
  update:
    security:
    - JWT: []
    x-source-doc: https://docs.api.memo.bank/authentication
    x-api-evangelist-rationale: >-
      Adds the top-level default so the requirement holds even for operations added later without an explicit
      security block.
- target: $.components
  update:
    parameters:
      IdempotencyKey:
        name: Idempotency-Key
        in: header
        required: false
        description: >-
          Idempotency key for safely retrying a mutating request. Memo Bank recommends a V4 UUID. Retry with
          the SAME key on a network error or a 5XX, 409 or 429 response; do not retry on other 4XX codes, as
          the same result is always returned. A replayed response carries the Idempotent-Replayed: true
          header. Reusing a key while the original request is still in flight returns 409 Conflict (itself
          safe to retry); reusing a key with a different body returns 422 Unprocessable Entity. Not supported
          on GET or DELETE, which are inherently idempotent.
        schema:
          type: string
          format: uuid
        example: 19b390d1-e7d4-4e27-abe2-49cac9b41ba1
        x-source-doc: https://docs.api.memo.bank/topic/topic-idempotent-requests
      RateLimitLimit:
        name: RateLimit-Limit
        in: header
        description: Total number of available requests between two quota resets.
        schema:
          type: integer
        x-source-doc: https://docs.api.memo.bank/topic/topic-rate-limiting
    schemas:
      Error:
        type: object
        description: >-
          Memo Bank's unified error envelope. Errors are distinguished by the code key; message is a plain
          English explanation. Note this is NOT RFC 9457 problem+json.
        required:
        - code
        - message
        properties:
          code:
            type: string
            description: Machine-readable error code.
            example: not_found
          message:
            type: string
            description: Plain English explanation of the problem.
            example: Not found.
        x-source-doc: https://docs.api.memo.bank/topic/topic-errors
    responses:
      TooManyRequests:
        description: >-
          Rate limit exhausted. RateLimit-Limit, RateLimit-Remaining and RateLimit-Reset are returned on every
          response, so a client can anticipate this. Safe to retry with the same Idempotency-Key after
          RateLimit-Reset seconds.
        headers:
          RateLimit-Limit:
            description: Total number of available requests between two quota resets.
            schema:
              type: integer
          RateLimit-Remaining:
            description: Number of available requests until the quota is reset.
            schema:
              type: integer
          RateLimit-Reset:
            description: Time remaining in seconds until the quota is reset.
            schema:
              type: integer
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
        x-source-doc: https://docs.api.memo.bank/topic/topic-rate-limiting
      Unauthorized:
        description: >-
          Missing, malformed, expired or replayed request JWT. Common causes are client clock drift beyond the
          5-second iat window, a sub claim that does not exactly match the method and full path including
          query string, or a missing dig#S256 on a request with a body.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
        x-source-doc: https://docs.api.memo.bank/authentication
      Conflict:
        description: >-
          An Idempotency-Key was reused while the original request is still being processed. Safe to retry
          with the same key.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
        x-source-doc: https://docs.api.memo.bank/topic/topic-idempotent-requests
      UnprocessableEntity:
        description: >-
          An Idempotency-Key was reused with a request body that differs from the original. Do not retry;
          use a new key or send the original payload.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
        x-source-doc: https://docs.api.memo.bank/topic/topic-idempotent-requests
    x-api-evangelist-rationale: >-
      The published spec declares only 200, 201 and 204 across all 43 operations - there is no error schema
      and no 4xx/5xx response anywhere in it, despite Memo Bank documenting an error envelope, an
      idempotency contract with specific 409/422 semantics, and a 429 rate-limit response. These reusable
      components make that documented contract addressable.

x-note: >-
  Non-destructive enhancements over the spec Memo Bank publishes at https://docs.api.memo.bank/source.yaml.
  The original is preserved byte-for-byte in openapi/_original/. Every action below documents something Memo
  Bank states in its own prose documentation but omitted from the machine-readable contract - most
  importantly the JWT security scheme that all 43 operations reference but which is never defined, and the
  Idempotency-Key header that makes retrying a payment safe. Nothing here invents behaviour: each action's
  x-source-doc names the Memo Bank page it came from.
actions:

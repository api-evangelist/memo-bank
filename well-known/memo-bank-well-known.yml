  eight standard paths return 404 on all seven hosts probed. The single real document found is an RFC 9728
  OAuth 2.0 Protected Resource Metadata file, which is served at the path-suffixed location for the MCP
  server resource (/.well-known/oauth-protected-resource/api/apps/mcp/server) rather than at the bare
  /.well-known/oauth-protected-resource root, which 404s. That document was discovered from the
  WWW-Authenticate challenge the MCP endpoint returns, not by guessing a path. Note also that
  https://memo.bank/security.txt answers HTTP 200 with the Next.js single-page-app shell (it parses the
  filename as a locale, emitting <html lang="security.txt">) and is NOT a security.txt - it is recorded
  below as a soft-200 miss.

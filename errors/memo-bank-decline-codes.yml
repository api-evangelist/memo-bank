masking:
  masked_to_counterparty: >-
    Bank refusal reasons (beneficiary_bank_refusal, debtor_bank_refusal) are deliberately opaque - Memo Bank
    surfaces that the counterparty bank refused but not why, because the reason is not disclosed to it
    either.
  internal_only_fields:
  - internal_note
  - custom_id
  - custom_metadata
  note: >-
    internal_note, custom_id and custom_metadata are documented as visible only in the Memo Bank workspace
    and NOT transmitted on the payment, so they are safe places for reconciliation keys. message by contrast
    is visible to all involved parties.
return_linkage:
  field: return_transaction_id
  present_on:
  - TransferV2
  - Collection
  meaning: >-
    When a payment is returned, this holds the id of the corresponding counter-transaction (a credit
    transaction for a returned transfer, a debit for a returned collection), so a reconciliation system can
    link the original and its reversal without matching on amount and date.
prevention:
  pre_flight_verification:
    operations:
    - createAccountAssessment
    - getAccountAssessment
    purpose: >-
      IBAN and account-holder-name verification before initiating, which pre-empts invalid_beneficiary_iban,
      unreachable_beneficiary_iban and beneficiary_bank_invalid_bank_details.
    identification_types:
    - LeiIdentification
    - SirenIdentification
    - NameIdentification
summary:
  total_codes: 71
  unique_codes: 55
  rails: 3
  documented: 43
  undocumented: 28
  shared_across_rails:
  - execution_failure
  - intermediary_system_error
  - memo_error
  - memo_refusal
  - current_account_not_found
  - insufficient_funds
  - maximum_amount_exceeded
  assessment: >-
    An unusually good failure taxonomy for a bank API - the codes separate validation, execution and
    settlement stages and attribute fault to a party (yours, ours, the counterparty's bank, the network),
    which is what a reconciliation system actually needs to decide whether to retry. The single largest gap
    is that the 28 wire-transfer codes ship undocumented.
gaps:
- >-
  WireTransfer's 28 failure codes have no published meanings, on the most operationally complex rail
  (cross-border, correspondent banking).
- >-
  Three TransferV2 codes (invalid_currency_for_account, account_does_not_support_network,
  missing_beneficiary_address) are in the enum but absent from the documented list.
- >-
  No standalone decline-code reference page, so the codes are discoverable only by reading the OpenAPI
  property descriptions.
- >-
  No retryable/terminal flag on any code; the retry decision is left entirely to the integrator's reading of
  the prose.
- No mapping to SEPA ISO 20022 return reason codes (AC04, AM04, MD01, MS03 and so on).

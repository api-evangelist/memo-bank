note: >-
  Memo Bank publishes no standalone decline-code reference PAGE, but it does something better: the codes are
  in the machine-readable contract. The failure_code property on TransferV2, WireTransfer and Collection
  carries a full enum, and the TransferV2 and Collection property descriptions document each code's meaning
  in prose inside the spec itself. This artifact lifts those verbatim. WireTransfer is the exception - its
  28-value enum has no per-code documentation, so those entries carry the code and its rail but a null
  meaning rather than a guessed one.
envelope:
  field: failure_code
  present_on:
  - TransferV2.failure_code
  - WireTransfer.failure_code
  - Collection.failure_code
  semantics: >-
    Populated only when the resource reaches the failed status. It is a resource property, not an API error
    body, so it is read by polling the resource or by handling the *_failed webhook event and then fetching
    the resource.
  companion_field: status
  distinct_from: >-
    errors/memo-bank-problem-types.yml covers API-level errors returned as HTTP responses. These codes
    describe a payment that was accepted by the API and then failed at execution or settlement.
bulk_vs_single_semantics:
  rule: >-
    A meaningful and easily-missed distinction that Memo Bank documents explicitly. A subset of these codes
    can only ever appear as a failure_code on a payment initiated inside a BULK. For a single payment the
    same condition is returned synchronously as an HTTP error response and the resource is never created at
    all.
  implication: >-
    An integrator handling both single and bulk initiation must implement the same condition twice - once as
    a synchronous API error, once as an asynchronous failure_code - or bulk failures will go unhandled.
  applies_to:
  - single_only_as_http_error: true
    codes_transfer:
    - current_account_not_found
    - instant_transfer_not_available
    - insufficient_funds
    - invalid_beneficiary_iban
    - maximum_amount_exceeded
    - missing_new_beneficiary_name
    - new_beneficiary_is_owned_iban
    - transfer_to_same_account
    - transfer_to_owned_account_with_virtual_iban
    - transfer_from_saving_account_to_external_beneficiary
    - unreachable_beneficiary_iban
    codes_collection:
    - account_cannot_receive_collections
    - current_account_not_found
    - creditor_is_saving_account
    - no_sepa_creditor_identifier
    - mandate_info_missing
    - mandate_iban_mismatch
    - collection_to_same_account

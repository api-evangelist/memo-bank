  documentation_gap: The WireTransfer.failure_code description is a single sentence with no per-code breakdown, unlike its TransferV2 and Collection siblings. All 28 codes below are recorded verbatim from the enum with a null meaning - none has been inferred, even where the code name looks self-describing, because guessing the semantics of a cross-border payment failure is exactly the kind of error that would mislead an integrator.

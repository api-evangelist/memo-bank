apis:
- name: Memo Bank Premium Bank API
  description: >-
    REST/JSON banking API for Memo Bank business customers, authenticated with RS256-signed JWT request
    tokens. Covers accounts and balances, transactions with typed transaction sources, virtual and standard
    IBANs, SEPA credit transfers (standard and instant), SEPA Direct Debit collections, mandate signature
    requests, SWIFT/RTGS wire transfers, bulk transfer and collection batches, transaction attachments,
    account assessments (IBAN/name verification), webhook management, and sandbox-only endpoints that
    simulate incoming transactions. 43 operations across 32 paths, plus an OpenAPI 3.1 webhooks block
    describing 34 event types.
  humanURL: https://docs.api.memo.bank/
  baseURL: https://api.memo.bank
  tags:

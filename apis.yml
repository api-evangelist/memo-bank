- aid: memo-bank:memo-bank-collections-api
  name: Memo Bank Collections API
  description: "Collections are SEPA direct debit collections, including SEPA CORE direct debits and SEPA\
    \ B2B direct debits. \n\nTo initiate a direct debit, a **mandate** signed by the debtor is required.\
    \  You have the option to use our [signature request](endpoint-mandate-signature-requests)  workflow,\
    \ which handles this signature, or you can choose to manage it  yourself. Whichever method you select,\
    \ you will only need to provide  the mandate information when setting up the direct debit, not the\
    \ signed  document itself.\n\nThey can be initiated asynchronously, one by one or in bulk. \n\nUnlike\
    \ [transfers](#endpoint-transfers), collections can only be scheduled for a date in the future.  As\
    \ a result, their lifecycle is also simplified.\n\n<img src=\"https://assets.memo.bank/memobankapi/collections-lifecycle-api-v3.png\"\

- name: Memo Bank Marketplace API
  description: >-
    OAuth 2.0 authorization layer that lets third-party developers build Memo Bank Marketplace integrations
    and call the Premium Bank API on behalf of consenting customers. Documents the authorization flow,
    connection lifecycle, marketplace webhooks, and the token endpoint that exchanges an authorization code
    or refresh token for a short-lived access token.
  humanURL: https://docs-marketplace.api.memo.bank/
  baseURL: https://api.memo.bank
  tags:
  - Open Banking
  - Authentication
  - Marketplace
  - Banking
  tags_raw:

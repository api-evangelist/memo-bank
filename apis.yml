apis:
- aid: memo-bank:memo-bank-account-assessments-api
  name: Memo Bank Account assessments API
  description: >-
    Account assessments allow you to assess SEPA counterparty accounts before initiating transactions
    with them. An assessment provides:


    * **Risk indicators**: Detection of fraudulent activity, suspicious patterns, and other risk signals.

    * **Identification matching**: Verify that the account name or other identifiers match the value known
    by the account holder.

    * **Account reachability**: Information about which payment schemes are supported by the account holder.


    Account assessments are processed asynchronously: you need to listen to `account_assessment_completed`
    and `account_assessment_failed` webhook  events to know when its time to retrieve the assessment results.


    This feature is subject to specific pricing, please reach out to your banker to get more information.
  humanURL: https://docs.api.memo.bank/
  baseURL: https://api.memo.bank

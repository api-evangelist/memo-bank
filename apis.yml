aid: memo-bank
name: Memo Bank
description: >-
  Memo Bank is an independent French commercial bank, accredited as a credit institution by the European
  Central Bank and supervised by the ACPR, that serves small and mid-sized companies with current accounts,
  loans, savings and an API-first payments platform. Its Premium Bank API is a REST/JSON contract authenticated
  with RS256-signed JWT/JWS request tokens, covering accounts, transactions, bi-directional virtual IBANs,
  SEPA credit transfers, SEPA Direct Debit collections and mandate signature requests, SWIFT/RTGS wire
  transfers, bulk payment batches, attachments and account assessments, with 34 webhook event types for
  asynchronous reconciliation. A Marketplace API adds an OAuth 2.0 layer so third-party developers can act on
  customer resources, a NextGenPSD2 API implements the Berlin Group AIS/PIS interface for licensed third-party
  providers, and a hosted MCP server exposes read-only banking data plus attachment upload to AI assistants.

- aid: memo-bank:memo-bank-ais-api
  name: Memo Bank AIS API
  description: "Account Information Service.\n\n\nConsent is given using the **OAuth2 as a pre-step**\
    \ authentication flow described in NextGenPSD2 specifications.\nThis means you don't have to manage\
    \ consents using the dedicated endpoints (which are not implemented), \nbut only to redirect the PSU\
    \ to our authorisation page (using `AIS` as OAuth2 scope).\nAfter performing a strong customer authentication,\
    \ the PSU will be redirected to your redirect URI with an \n**authorisation code** that you can then\
    \ exchange for an **access token**.\n\n\nThis **access token** will let you authenticate at the XS2A\
    \ interface to request the PSU accounts balances and \ntransactions history."

  - type: GettingStarted
    url: https://docs-marketplace.api.memo.bank/topic/topic-getting-started
  - type: Overlay
    url: overlays/memo-bank-marketplace-api-overlay.yaml
- name: Memo Bank NextGenPSD2 API
  description: >-
    Berlin Group NextGenPSD2 XS2A implementation (Implementation Guidelines 1.3.11) exposing Account
    Information Service and Payment Initiation Service endpoints to licensed third-party payment service
    providers under PSD2. Provides account lists, details, balances and transactions, card account
    equivalents, and payment initiation, status and cancellation, secured with eIDAS certificates and an
    OAuth 2.0 authorization-code flow carrying AIS and PIS scopes.
  humanURL: https://docs-nextgenpsd2.api.memo.bank/
  baseURL: https://api.memo.bank/nextgenpsd2

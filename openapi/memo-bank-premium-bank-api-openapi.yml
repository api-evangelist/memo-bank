      allOf:
      - $ref: "#/components/schemas/CreateMandateSignatureRequestDiscriminator"
      - type: object
        properties:
          redirect_uri:
            maxLength: 2048
            minLength: 1
            pattern: "^https://[a-zA-Z0-9.\\-]{1,255}(:[0-9]{1,5})?(/[^\\s]*)?$"
            type: string
            description: URI to redirect the debtor after signing. Must be an absolute
              HTTPS URL.
            example: https://example.com/signed
    MandateSignatureRequestPage:

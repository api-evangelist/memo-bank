      - language
      - mode
      - reference
      - scheme
      - status
      type: object
      allOf:
      - $ref: "#/components/schemas/MandateSignatureRequestDiscriminator"
      - type: object
        properties:
          email_custom_message:
            type: string
            description: Custom text message included in the email sent to the debtor.
            example: "Hi John Doe, here's a collection mandate to sign."
    MandateSignatureRequest:
      type: object
      discriminator:
        propertyName: mode
        mapping:
          email: "#/components/schemas/EmailMandateSignatureRequest"
          redirect: "#/components/schemas/RedirectMandateSignatureRequest"
      oneOf:
      - $ref: "#/components/schemas/EmailMandateSignatureRequest"
      - $ref: "#/components/schemas/RedirectMandateSignatureRequest"
    MandateSignatureRequestDebtor:
      required:
      - iban
      - name
      type: object
      properties:
        name:
          type: string
          description: Debtor's name.
          example: John Doe
        iban:
          type: string
          description: Debtor's IBAN.
          example: FR2512739000308553756377J95
        address:
          $ref: "#/components/schemas/Address"
      description: Debtor information filled when the request was signed. This is
        available when the request is completed.
    RedirectMandateSignatureRequest:
      required:
      - debtor_email
      - id
      - is_deleted
      - language
      - mode
      - redirect_uri
      - reference
      - scheme
      - signature_url
      - status
      type: object
      allOf:
      - $ref: "#/components/schemas/MandateSignatureRequestDiscriminator"
      - type: object
        properties:
          signature_url:
            type: string
            description: URL the debtor must visit to sign the mandate.
            example: https://client.memo.bank/mandate/abc123
          redirect_uri:
            type: string
            description: URL the debtor is redirected to after signing.
            example: https://example.com/signed
    CreateEmailMandateSignatureRequest:
      required:
      - debtor_email
      - mode
      - reference
      - scheme
      type: object
      allOf:
      - $ref: "#/components/schemas/CreateMandateSignatureRequestDiscriminator"
      - type: object
        properties:
          email_custom_message:
            maxLength: 3000
            minLength: 1
            pattern: "^[a-zA-Zà-üÀ-Ü0-9€@&;.,?!()+\\-'’\"\\s]*$"
            type: string
            description: Custom text message that will be included in the email sent
              to the debtor.
            example: "Hi John Doe, here's a collection mandate to sign."
    CreateMandateSignatureRequest:
      type: object
      discriminator:
        propertyName: mode
        mapping:
          email: "#/components/schemas/CreateEmailMandateSignatureRequest"
          redirect: "#/components/schemas/CreateRedirectMandateSignatureRequest"
      oneOf:
      - $ref: "#/components/schemas/CreateEmailMandateSignatureRequest"
      - $ref: "#/components/schemas/CreateRedirectMandateSignatureRequest"
    CreateMandateSignatureRequestDebtor:
      type: object
      properties:
        name:
          maxLength: 256
          minLength: 1
          type: string
          description: Name of the debtor.
          example: John Doe
        iban:
          pattern: "^[A-Z]{2}[0-9]{2}[a-zA-Z0-9]{1,30}$"
          type: string
          description: IBAN of the debtor.
          example: FR2512739000308553756377J95
        address:
          $ref: "#/components/schemas/CreateMandateSignatureRequestDebtorAddress"
      description: Debtor data used to prefill the signing form. All fields are optional;
        the debtor can still edit them before signing.
    CreateMandateSignatureRequestDebtorAddress:
      type: object
      properties:
        street:
          maxLength: 256
          minLength: 1
          type: string
          description: Name of the street.
          example: rue de la Boétie
        postal_code:
          maxLength: 256
          minLength: 1
          type: string
          description: Postal or zip code.
          example: "75008"
        city:
          maxLength: 256
          minLength: 1
          type: string
          description: Name of the city.
          example: Paris
        country:
          pattern: "^[A-Z]{2}$"
          type: string
          description: ISO3166-1 alpha-2 country code.
          example: FR
      description: Debtor address used to prefill the signing form. All fields are
        optional.
    CreateRedirectMandateSignatureRequest:

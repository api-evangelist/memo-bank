          description: Number of collections canceled before processing.
          format: int32
          example: 2
        collections_failed:
          type: integer
          description: Number of collections that were processed and failed.
          format: int32
          example: 57
        status:
          type: string
          description: Aggregated status of the bulk.
          example: pending
          enum:
          - pending
          - completed
    CreateBulkCollections:
      required:
      - collections
      type: object
      properties:
        collections:
          type: array
          description: "Collection creations to execute. There should not be more\
            \ than 5000 collections in a single bulk, and there should be at least\
            \ one."
          items:
            $ref: "#/components/schemas/CreateCollection"
    CollectionPage:
      required:
      - has_next
      - has_prev
      - results
      type: object
      properties:
        results:
          type: array
          description: Elements of the page.
          items:
            $ref: "#/components/schemas/Collection"
        has_prev:
          type: boolean
          description: "Flag indicating if there is a previous page. Deprecated, use\
            \ `prev_page_token` instead."
          deprecated: true
        has_next:
          type: boolean
          description: "Flag indicating if there is a next page. Deprecated, use `next_page_token`\
            \ instead."
          deprecated: true
        next_page_token:
          type: string
          description: "Token to fetch the next page, to be passed in subsequent requests\
            \ as the `page_token` query parameter. `null` when there is no next page."
          nullable: true
          example: eyJwIjozfQ
        prev_page_token:
          type: string
          description: "Token to fetch the previous page, to be passed in subsequent\
            \ requests as the `page_token` query parameter. `null` when there is no\
            \ previous page."
          nullable: true
          example: eyJwIjoxfQ
    Iban:
      required:
      - account_id
      - allow_collections
      - iban
      - id
      - is_deleted
      - name
      - status
      - type
      type: object
      properties:
        id:
          type: string
          description: ID of the IBAN.
          format: uuid
          example: c70bd7bc-58e0-4fdb-8c1f-70186e0de587
        account_id:
          type: string
          description: ID of the account this IBAN belongs to.
          format: uuid
          example: 29883c3d-0b11-4c38-91b0-af9018cc5b14
        iban:
          type: string
          description: Actual value of the IBAN.
          example: FR27590171083068762111832788
        name:
          type: string
          description: Name of the IBAN.
          example: customer no12345
        status:
          type: string
          description: Status of the IBAN. It determines if an IBAN accepts incoming
            or outgoing transfers.
          example: active
          enum:
          - active
          - inactive
        type:
          type: string
          description: "Flag indicating if this IBAN is the main IBAN of an account,\
            \ or a virtual IBAN. Please note that main IBANs cannot be updated or\
            \ deleted."
          example: virtual
          enum:
          - main
          - virtual
        allow_collections:
          type: boolean
          description: Whether or not this IBAN accepts incoming collections.
          example: true
        is_deleted:
          type: boolean
          description: Whether or not this IBAN has been deleted.
          example: false
    CreateIban:
      required:
      - account_id
      - name
      type: object
      properties:
        account_id:
          type: string
          description: ID of the account.
          format: uuid
          example: 29883c3d-0b11-4c38-91b0-af9018cc5b14
        name:
          type: string
          description: "Custom name of the new IBAN, as seen in the Memo Bank interface."
          example: customer no12345
        allow_collections:
          type: boolean
          description: Whether or not to accept incoming collections on this IBAN.
          default: true
    IbanPage:
      required:
      - has_next
      - has_prev
      - results
      type: object
      properties:
        results:
          type: array
          description: Elements of the page.
          items:
            $ref: "#/components/schemas/Iban"
        has_prev:
          type: boolean
          description: "Flag indicating if there is a previous page. Deprecated, use\
            \ `prev_page_token` instead."
          deprecated: true
        has_next:
          type: boolean
          description: "Flag indicating if there is a next page. Deprecated, use `next_page_token`\
            \ instead."
          deprecated: true
        next_page_token:
          type: string
          description: "Token to fetch the next page, to be passed in subsequent requests\
            \ as the `page_token` query parameter. `null` when there is no next page."
          nullable: true
          example: eyJwIjozfQ
        prev_page_token:
          type: string
          description: "Token to fetch the previous page, to be passed in subsequent\
            \ requests as the `page_token` query parameter. `null` when there is no\
            \ previous page."
          nullable: true
          example: eyJwIjoxfQ
    UpdateIban:

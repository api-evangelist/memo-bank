      operationId: listTransactions
      parameters:
      - name: account_id
        in: query
        description: Filter transactions by account.
        schema:
          type: string
          format: uuid
        example: 29883c3d-0b11-4c38-91b0-af9018cc5b14
      - name: page
        in: query
        description: "Index of the requested page. Deprecated, use `page_token` instead."
        deprecated: true
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: page_token
        in: query
        description: "Token used to fetch a specific page, as returned by the `next_page_token`\
          \ or `prev_page_token` field of a previous response. Mutually exclusive\
          \ with `page`."
        schema:
          type: string
      - name: size
        in: query
        description: Number of elements per page in response.
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 10
      - name: start_date
        in: query
        description: "Filter transactions by execution date (inclusive greater than),\
          \ in ISO8601 format."
        schema:
          type: string
          format: date-time
        example: 2021-09-01T12:30:00Z
      - name: end_date
        in: query
        description: "Filter transactions by execution date (exclusive lower than),\
          \ in ISO8601 format."
        schema:
          type: string
          format: date-time
        example: 2021-09-30T12:30:00Z
      - name: reference
        in: query
        description: Filter transactions by reference.
        schema:
          type: string
          format: uuid
        example: 0c734fd7-4753-424e-85f3-0b4e3590ee1c
      - name: local_iban
        in: query
        description: Filter transactions by local IBAN. Allows for example to list
          all incoming **and** outgoing transactions that passed through a given virtual
          IBAN.
        schema:
          type: string
      - name: batch_id
        in: query
        description: Filter transactions by transaction batch.
        schema:
          type: string
          format: uuid
        example: 0c734fd7-4753-424e-85f3-0b4e3590ee1c
      - name: custom_id
        in: query
        description: Filter transactions by custom ID.
        schema:
          type: string
        example: 637406efda8534de8c0e
      - name: order_by
        in: query
        description: Sort transactions in ascending or descending order.
        schema:
          type: string
          default: -execution_date
          enum:
          - execution_date
          - -execution_date
      responses:
        "200":
          description: OK
          content:

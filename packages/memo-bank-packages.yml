integration_path:
  documented_approach: >-
    Hand-rolled HTTP with a self-constructed RS256 JWT per request. Memo Bank documents the exact header and
    payload claims (alg, typ, x5t#S256, sub, aud, iat, jti, sec, dig#S256) and directs integrators to a
    generic JWT library of their choice.
  generic_libraries_referenced: https://jwt.io/libraries
  api_recipes: https://aide.memo.bank/category/349-api
  impact: >-
    The auth scheme is the reason an SDK matters more here than for a typical API. Every request needs a
    freshly minted token whose sub pins the method and full path with query string, whose iat must be within
    5 seconds of server time, and whose dig#S256 is a base64url SHA-256 of the body. That is a substantial
    amount of correct-by-construction code that every customer must write and maintain independently, and
    each of those constraints is a distinct silent-failure mode. A first-party SDK in even one language
    would remove the highest-friction part of onboarding.

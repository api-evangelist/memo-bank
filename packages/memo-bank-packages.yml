note: >-
  Memo Bank publishes NO first-party client library in any package registry. Searched npm (queries
  "memobank", "memo-bank", "memo.bank"), PyPI (memobank, memo-bank, memobank-api), RubyGems, crates.io and
  Packagist on 2026-08-17: every candidate returned either 404 or unrelated third-party packages. The
  documentation never references an SDK - it teaches integrators to construct and RS256-sign the JWT
  themselves, pointing at jwt.io/libraries for the crypto rather than at a Memo Bank library. The
  github.com/memobank organisation has 13 public repositories and none is an API client; the only
  finance-adjacent one, swift-money, is a FORK of an upstream project with no tags or releases, so it is not
  a Memo Bank SDK either. This is an honest zero, not an unsearched gap.

gaps:
- No Sunset or Deprecation headers (RFC 8594); deprecation is announced only in the changelog.
- No sunset date for the deprecated page pagination parameter.
- No deprecated:true markers in the OpenAPI despite an in-flight deprecation.
- status.memo.bank redirects to a help article rather than a status dashboard, and exposes no status API.
- Versioning prose still references /v1/ while the shipped contract is entirely /v2/.

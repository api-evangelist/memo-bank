versioning:
  scheme: uri-path
  current: v2
  pattern: /v2/...
  docs: https://docs.api.memo.bank/topic/topic-versioning-and-backwards-compatibility
  documented_version_label: '2.0'
  breaking_change_rule: >-
    The path version number is incremented when a breaking change is introduced; backward-compatible changes
    ship without a version bump.
  media_type_versioning: >-
    Webhook payloads additionally accept application/vnd.memo-bank.v1+json alongside application/json,
    giving a second, media-type-based versioning lever.
  note: >-
    A live inconsistency worth flagging: the versioning topic and the idempotency example both still say
    /v1/, and the NextGenPSD2 API is on /v1/, while every one of the 43 operations in the current Premium
    Bank OpenAPI is under /v2/. The prose has not been updated to match the contract.
  non_breaking_changes:
  - Adding new API resources.
  - Adding new optional request parameters to existing API methods.
  - Adding new properties to existing API responses.
  - Changing the order of properties in existing API responses.
  - Changing the length or format of opaque strings such as object IDs and error messages.
  - Adding new EventType or ResourceType enum values for webhooks.
  - Adding new TransactionSource enum values for transactions.
  consumer_obligation: >-
    Clients must tolerate unknown enum values without failing, because Memo Bank reserves the right to add
    EventType, ResourceType and TransactionSource members inside a version.
deprecation:
  policy_url: https://docs.api.memo.bank/topic/topic-versioning-and-backwards-compatibility
  policy_published: true
  sunset_header: false
  deprecation_header: false
  rfc8594_support: false
  note: >-
    Memo Bank publishes a real backwards-compatibility contract that enumerates exactly which changes are
    non-breaking, and it demonstrably practises versioned deprecation - the page parameter was deprecated in
    favour of page_token on 2026-05-13 and both remain available on all 8 paginated operations. What is
    missing is the runtime signal: no Sunset or Deprecation response headers (RFC 8594) are documented, and
    no sunset date is published for the deprecated page parameter, so a client learns about deprecation only
    by reading the changelog.
  observed_deprecations:
  - item: page query parameter
    superseded_by: page_token
    announced: '2026-05-13'
    still_available: true
    sunset_date: not published
    affected_operations: 8
deprecated_operations: []
deprecated_operations_note: >-
  No operation in openapi/memo-bank-premium-bank-api-openapi.yml carries deprecated: true. The one live
  deprecation (the page parameter) is documented in the changelog but is not marked deprecated in the spec
  either, so the machine-readable contract carries no deprecation signal at all.

note: >-
  Entity-relationship graph derived from the 119 schemas in the Premium Bank API OpenAPI - $ref links and
  id-reference fields (account_id, transaction_id, batch_id, resource_id, return_transaction_id). Memo Bank
  publishes no separate object reference page, so identifier conventions below are read off the spec's
  declared formats rather than from prose. Every entity, field and relationship named here exists verbatim
  in the spec.
identifiers:
  scheme: UUID
  prefixed_ids: false
  note: >-
    All primary keys are bare RFC 4122 UUIDs (format: uuid) with no type prefix, so an identifier is not
    self-describing - unlike Stripe-style prefixed ids, a bare UUID gives no clue which endpoint to call.
    Callers must track the type alongside the id, which is exactly why the webhook Event carries an explicit
    resource_type next to resource_id.
  business_identifiers:
  - field: reference
    type: uuid
    entities:
    - Transaction
    - Transfer
    - TransferV2
    - WireTransfer
    - Collection
    purpose: >-
      Correlates an initiated payment with the resulting transaction. The key that joins the instruction side
      of the model to the ledger side.
  - field: end_to_end_id
    entities:
    - TransferV2
    - Collection
    purpose: SEPA end-to-end identification carried on the payment itself.
  - field: uetr
    entities:
    - WireTransfer
    purpose: SWIFT Unique End-to-end Transaction Reference.
  - field: custom_id
    entities:
    - Transaction
    - TransferV2
    - WireTransfer
    - Collection
    purpose: >-
      Caller-supplied reconciliation key, explicitly NOT transmitted on the payment - the intended join key
      back to the integrator's own system.
  - field: mandate.reference
    entities:
    - CollectionMandate
    purpose: >-
      Unique SEPA mandate reference. Natural-keyed rather than UUID: reusing a reference with a different
      IBAN fails with mandate_iban_mismatch.
money_representation:
  amount: integer, minor units (smallest unit of the currency)
  currency: ISO 4217 string
  note: >-
    Integer minor units throughout - no floats anywhere in the model, which is correct and worth recording as
    a positive finding for a banking API. WireTransfer uses instructed_amount / instructed_currency to
    distinguish the instructed currency from the settlement currency.
dates:
  format: ISO 8601
  transaction_dates:
  - field: request_date
    meaning: When the transaction was requested.
  - field: execution_date
    meaning: When processing started or will start.
  - field: accounting_date
    meaning: When the transaction was confirmed.
  note: >-
    A three-date model on Transaction, which is what makes value-date accounting possible; most API-first
    banking products expose only one timestamp.

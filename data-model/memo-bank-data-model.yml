graph_summary:
  entities: 22
  core_entities: 14
  polymorphic_entities: 5
  relationships: 25
  root: Account
  spine: >-
    Account -> Iban -> Transaction is the read spine, and every instruction type (TransferV2, WireTransfer,
    Collection) converges on Transaction via reference. An integrator reconciling money movement can treat
    Transaction as the single source of truth and use custom_id to join back to their own records.
gaps:
- >-
  Mandates are embedded value objects with no list/get operation, so there is no way to enumerate or audit
  active mandates.
- >-
  No Users entity despite a declared Users tag and a coming-soon list_users MCP tool.
- >-
  Transaction references its IBAN by string value rather than by Iban.id, so joins are on the IBAN literal.
- >-
  Bare UUIDs with no type prefix mean identifiers are not self-describing outside the webhook envelope.
- >-
  Lending, card and investment products appear as 20+ TransactionSource variants but have no resources or
  operations - they are read-only ledger artefacts.

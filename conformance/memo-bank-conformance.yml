- id: odata
  conforms: false
  evidence: Not an OData service.
- id: json-api
  conforms: false
  evidence: >-
    Plain JSON with per-collection *Page envelopes; no JSON:API media type, no data/included/links structure.
- id: fdx
  conforms: false
  evidence: >-
    Not applicable - FDX is the North American financial data-sharing standard. Memo Bank is a French bank and

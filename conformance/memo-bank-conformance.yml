- id: fhir-r4
  conforms: false
  evidence: Not applicable - Memo Bank is a bank, not a healthcare provider.
- id: scim
  conforms: false
  evidence: >-
    No SCIM 2.0 user-provisioning surface. The OpenAPI declares a Users tag but publishes no operations under

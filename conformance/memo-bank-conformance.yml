regulatory:
  regime: EU banking
  licenses:
  - authority: European Central Bank (ECB)
    status: Accredited as a credit institution
  - authority: Autorite de controle prudentiel et de resolution (ACPR)
    status: Prudential supervisor
    address: 4 place de Budapest, 75009 Paris
  - authority: Autorite des marches financiers (AMF)
    status: Investment services provided via a tied agent arrangement
  source: https://memo.bank/en/about/security-operations/
  significance: >-
    A full ECB credit-institution licence is a materially higher bar than the electronic money institution or
    payment institution licence most fintech "banking API" providers hold, and it is the reason the PSD2
    obligation applies to Memo Bank as an account-servicing payment service provider.
security_posture:

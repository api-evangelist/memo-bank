  - term: Transactions
    definition: Transactions are any debit and credit operations on an account. Note that the status of the transaction indicates whether or not
      it affects the account’s available balance. `debit` transactions impact the balance as soon as they reach the `authorized` state. `credit`
      transactions impact it only when their status turns to `confirmed`.
    tags:
    - Resource Group
    source: openapi/memo-bank-transactions-api-openapi.yml
  - term: Transfers
    definition: Transfers are transfers within the SEPA-zone, including SEPA standard transfers, SEPA instant transfers and Target 2 transfers.
      They can be initiated asynchronously, one by one or in bulk. They have a similar lifecycle compared to transactions but note that there
      are some minor differences for the `canceled` and `failed` states.
    tags:
    - Resource Group
